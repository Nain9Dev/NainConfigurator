<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&amp;family=Urbanist:wght@600;800;900&amp;display=swap');
      .txt-brand { font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.32em; text-transform: uppercase; }
      .txt-title { font-family: 'Urbanist', system-ui, sans-serif; font-weight: 900; }
      .txt-mono { font-family: 'IBM Plex Mono', monospace; }
    </style>
    <pattern id="grid_light" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#C6D2E3" stroke-width="1" />
    </pattern>
    <pattern id="grid_major_light" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#A8BCDA" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="360" fill="#EDF1F6" />
  <rect width="1280" height="360" fill="url(#grid_light)" opacity="0.6" />
  <rect width="1280" height="360" fill="url(#grid_major_light)" opacity="0.8" />
  <rect x="16" y="16" width="1248" height="328" fill="none" stroke="#002B66" stroke-width="2" rx="4" />

  <!-- Technical Cotas & Dimensions -->
  <line x1="16" y1="36" x2="1264" y2="36" stroke="#C6D2E3" stroke-width="1" stroke-dasharray="4 4" />
  <text x="32" y="29" class="txt-brand" font-size="10" font-weight="700" fill="#0047AB">NAINDEV ARCHITECTURAL BLUEPRINT // SPEC-1.5 // 52.0°</text>
  <text x="1040" y="29" class="txt-mono" font-size="10" fill="#4E6B92">SEC: configurator.naindev.com</text>

  <!-- Left Content: Logo & Title -->
  <g transform="translate(64, 60) scale(0.36363636363636365)">
    <defs>
      <mask id="cut_64_60_config_light">
        <rect x="0" y="0" width="440" height="440" fill="white" />
        <polygon points="60,60 160,60 340,340 240,340" fill="none" stroke="black" stroke-width="24" stroke-linejoin="miter" />
      </mask>
    </defs>
    <g mask="url(#cut_64_60_config_light)">
      <rect x="60" y="60" width="100" height="280" fill="#0047AB" rx="8" />
      <rect x="240" y="60" width="100" height="280" fill="#0047AB" rx="8" />
    </g>
    <polygon points="60,60 160,60 340,340 240,340" fill="#002B66" stroke-linejoin="miter" />
  </g>

  <g transform="translate(250, 75)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="165" height="24" fill="#0047AB" rx="4" />
    <text x="10" y="16" class="txt-brand" font-size="9" font-weight="700" fill="#FFFFFF">3D &amp; CONFIGURATOR</text>

    <!-- Main Project Name -->
    <text x="0" y="70" class="txt-title" font-size="52" fill="#002B66">NainConfigurator</text>

    <!-- Value Proposition -->
    <text x="0" y="105" class="txt-mono" font-size="16" font-weight="400" fill="#4E6B92">Catalog-Driven B2B Product Configurator with Compatibility Rules</text>

    <!-- Stack Footprint -->
    <text x="0" y="132" class="txt-mono" font-size="13" font-weight="600" fill="#0047AB">STACK: .NET 10 · React 19 · TypeScript · SQL Server · Babylon.js · 0.00 €</text>
  </g>

  <!-- Technical Angle Callout & Grid Reticle -->
  <g transform="translate(1080, 80)">
    <circle cx="90" cy="90" r="70" fill="none" stroke="#A8BCDA" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="90" y1="20" x2="90" y2="160" stroke="#A8BCDA" stroke-width="1" />
    <line x1="20" y1="90" x2="160" y2="90" stroke="#A8BCDA" stroke-width="1" />
    <line x1="90" y1="90" x2="145" y2="35" stroke="#0047AB" stroke-width="2" />
    <text x="105" y="60" class="txt-mono" font-size="11" font-weight="700" fill="#0047AB">52.0°</text>
    <text x="55" y="175" class="txt-mono" font-size="9" fill="#4E6B92">COTAS: 14% ATOM</text>
  </g>

  <!-- Metrics Bar -->
  <g transform="translate(64, 285)">
    <rect x="0" y="0" width="220" height="42" fill="#FFFFFF" stroke="#002B66" stroke-width="1.5" rx="4" />
    <circle cx="16" cy="21" r="4" fill="#0047AB" />
    <text x="28" y="25" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#002B66">Rule-Driven Catalog</text>
  </g>
  
  <g transform="translate(304, 285)">
    <rect x="0" y="0" width="220" height="42" fill="#FFFFFF" stroke="#002B66" stroke-width="1.5" rx="4" />
    <circle cx="16" cy="21" r="4" fill="#0047AB" />
    <text x="28" y="25" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#002B66">16 Passing Vitest</text>
  </g>
  
  <g transform="translate(544, 285)">
    <rect x="0" y="0" width="220" height="42" fill="#FFFFFF" stroke="#002B66" stroke-width="1.5" rx="4" />
    <circle cx="16" cy="21" r="4" fill="#0047AB" />
    <text x="28" y="25" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#002B66">Zero Schema Forking</text>
  </g>

  <g transform="translate(860, 285)">
    <rect x="0" y="0" width="356" height="42" fill="#002B66" stroke="#0047AB" stroke-width="1.5" rx="4" />
    <text x="24" y="26" class="txt-mono" font-size="12" font-weight="700" fill="#FFFFFF">LIVE DEMO 24/7 // configurator.naindev.com ↗</text>
  </g>
</svg>
